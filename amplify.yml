version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Node $(node -v) / npm $(npm -v)"
            - npm ci --prefer-offline --no-audit --fund=false
        build:
          commands:
            - echo "Stage 1/3 - Type check"
            - npm run typecheck
            - echo "Stage 2/3 - Lint"
            - npm run lint || true
            - echo "Stage 3/3 - Astro SSR build"
            - npm run build
            - echo "Build manifest:" && ls -la dist/
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .astro/**/*
          - ~/.npm/**/*
      buildPath: /
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Strict-Transport-Security'
            value: 'max-age=63072000; includeSubDomains; preload'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'Permissions-Policy'
            value: 'camera=(), microphone=(), geolocation=(), payment=()'
          - key: 'Content-Security-Policy'
            value: "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.hopepms.example.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
